<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mất kết nối</title>
<!-- Capacitor hiện trang này (server.errorPath) khi không tải được trang của máy chủ -->
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px;
         background: linear-gradient(160deg, #0b2545 0%, #12396b 55%, #1b63d6 120%); color: #fff; }
  .bt { font-size: 56px; } h1 { font-size: 22px; margin: 10px 0 6px; } p { opacity: .8; max-width: 320px; line-height: 1.55; font-size: 14.5px; }
  button { width: 100%; max-width: 320px; margin-top: 12px; padding: 14px; border: 0; border-radius: 12px; font-size: 15.5px; font-weight: 700; }
  .chinh { background: #fff; color: #0b2545; } .phu { background: rgba(255,255,255,.14); color: #fff; }
</style>
</head>
<body>
  <div class="bt">📡</div>
  <h1>Không kết nối được máy chủ</h1>
  <p>Kiểm tra máy tính đang chạy backend và điện thoại cùng mạng Wi-Fi, rồi thử lại.</p>
  <button class="chinh" onclick="location.replace('index.html')">Thử lại</button>
  <button class="phu" onclick="location.replace('index.html?doi_may_chu=1')">Đổi máy chủ</button>
</body>
</html>
