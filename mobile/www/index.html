<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<title>AirHCM</title>
<!-- Màn hình khởi động của app: kết nối máy chủ AirHCM rồi mở trang Tổng quan.
     Người dùng chỉ thấy logo và trạng thái; địa chỉ máy chủ không hiển thị.
     Thứ tự thử: máy chủ công khai (may_chu.js) → máy chủ đã dùng lần trước → địa chỉ thử nghiệm (máy ảo, mạng nội bộ).
     Dành cho người phát triển: mở index.html?doi_may_chu=1 để nhập địa chỉ khác. -->
<style>
  :root { --navy: #0b2545; --accent: #14b8a6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff; text-align: center;
    background: radial-gradient(500px 300px at 100% 0%, rgba(20,184,166,.35), transparent 60%),
                linear-gradient(160deg, #0b2545 0%, #12396b 55%, #1b63d6 120%);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
  }
  .logo { width: 92px; height: 92px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  h1 { margin: 18px 0 4px; font-size: 28px; letter-spacing: -.02em; }
  .sub { opacity: .75; font-size: 14px; }
  .trang-thai { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 34px; font-size: 14.5px; opacity: .9; min-height: 22px; }
  .vong { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: quay .8s linear infinite; flex: none; }
  @keyframes quay { to { transform: rotate(360deg); } }
  .loi { width: 100%; max-width: 340px; margin-top: 28px; }
  .loi h2 { font-size: 18px; margin: 0 0 8px; }
  .loi p { margin: 0 0 18px; opacity: .8; font-size: 14px; line-height: 1.55; }
  button { width: 100%; padding: 14px; border: 0; border-radius: 12px; font-size: 15.5px; font-weight: 700; cursor: pointer; }
  .chinh { background: #fff; color: var(--navy); }
  .phu { background: rgba(255,255,255,.12); color: #fff; margin-top: 10px; }
  input { width: 100%; padding: 13px 14px; margin-bottom: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25);
          background: rgba(0,0,0,.18); color: #fff; font-size: 16px; outline: none; }
  input:focus { border-color: var(--accent); }
  .an { display: none; }
</style>
</head>
<body>
  <img class="logo" src="icon-192.png" alt="AirHCM">
  <h1>AirHCM</h1>
  <div class="sub">Giám sát chất lượng không khí TP.HCM</div>

  <div class="trang-thai" id="trangThai" aria-live="polite"><span class="vong"></span><span>Đang kết nối…</span></div>

  <div class="loi an" id="khungLoi">
    <h2>Chưa kết nối được</h2>
    <p>Hãy kiểm tra Wi-Fi hoặc dữ liệu di động của điện thoại rồi thử lại.</p>
    <button class="chinh" id="nutThuLai">Thử lại</button>
  </div>

  <div class="loi an" id="khungNhap">
    <h2>Địa chỉ máy chủ</h2>
    <input id="oDiaChi" type="url" inputmode="url" autocomplete="off" placeholder="https://…">
    <button class="chinh" id="nutKetNoi">Kết nối</button>
    <button class="phu" id="nutTuDong">Dùng máy chủ mặc định</button>
  </div>

<script src="may_chu.js"></script>
<script>
(function () {
  var CONG_KHAI = window.AIRHCM_MAY_CHU || [];
  var THU_NGHIEM = ['http://10.0.2.2:8000', 'http://192.168.1.227:8000'];   // chỉ thử ngầm khi máy chủ công khai không trả lời
  var NHAN_TAC_VU_NEN = 'vn.edu.aqi.hcm.kiemtraaqi';
  var KHOA = 'may_chu_airhcm';
  var $ = function (id) { return document.getElementById(id); };

  function chuan(u) {
    u = (u || '').trim().replace(/\/+$/, '');
    if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }
  function daLuu() { try { return localStorage.getItem(KHOA); } catch (e) { return null; } }

  // Máy chủ AirHCM "sống" nếu tải được ảnh biểu tượng của chính nó trong thời hạn.
  // Không dùng fetch no-cors vì khi máy chủ tắt, Cloudflare vẫn trả trang lỗi HTML và fetch no-cors coi đó là thành công;
  // ảnh thì chỉ tải được khi máy chủ thật trả về tệp PNG.
  function thu(u, ms) {
    return new Promise(function (ok) {
      var xong = false, anh = new Image();
      var ket = function (s) { if (!xong) { xong = true; clearTimeout(t); anh.onload = anh.onerror = null; ok(s); } };
      var t = setTimeout(function () { ket(false); }, ms);
      anh.onload = function () { ket(anh.naturalWidth > 0); };
      anh.onerror = function () { ket(false); };
      anh.src = u + '/icons/favicon-32.png?kt=' + Date.now();
    });
  }
  // Thử cả nhóm cùng lúc, trả địa chỉ đầu tiên (theo thứ tự ưu tiên) kết nối được
  function thuNhom(ds, ms) {
    return Promise.all(ds.map(function (u) { return thu(u, ms); })).then(function (kq) {
      var i = kq.indexOf(true); return i >= 0 ? ds[i] : null;
    });
  }
  // Tác vụ nền (cảnh báo AQI khi đã đóng app): xin quyền thông báo và gửi địa chỉ máy chủ; tối đa 4 giây.
  function caiTacVuNen(u) {
    var P = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.BackgroundRunner;
    if (!P) return Promise.resolve();
    var viec = P.requestPermissions({ apis: ['notifications'] }).catch(function () {})
      .then(function () { return P.dispatchEvent({ label: NHAN_TAC_VU_NEN, event: 'luuCauHinh', details: { url: u } }); })
      .catch(function () {});
    return Promise.race([viec, new Promise(function (ok) { setTimeout(ok, 4000); })]);
  }
  function moWeb(u) {
    try { localStorage.setItem(KHOA, u); } catch (e) {}
    $('trangThai').innerHTML = '<span class="vong"></span><span>Đang mở AirHCM…</span>';
    caiTacVuNen(u).then(function () { location.replace(u + '/tong-quan.html'); });
  }
  function dangKetNoi() {
    $('khungLoi').classList.add('an'); $('khungNhap').classList.add('an');
    $('trangThai').classList.remove('an');
    $('trangThai').innerHTML = '<span class="vong"></span><span>Đang kết nối…</span>';
  }
  function baoLoi() {
    $('trangThai').classList.add('an');
    $('khungLoi').classList.remove('an');
  }

  function tuDong() {
    dangKetNoi();
    var luu = daLuu();
    var uuTien = CONG_KHAI.concat(luu && CONG_KHAI.indexOf(luu) < 0 ? [luu] : []);
    var phu = THU_NGHIEM.filter(function (u) { return uuTien.indexOf(u) < 0; });
    thuNhom(uuTien, 8000)
      .then(function (u) { return u || thuNhom(phu, 4000); })
      .then(function (u) { return u || thuNhom(uuTien, 8000); })   // mạng vừa bật: thử lại một lần
      .then(function (u) { if (u) moWeb(u); else baoLoi(); });
  }

  $('nutThuLai').onclick = tuDong;
  $('nutTuDong').onclick = function () { try { localStorage.removeItem(KHOA); } catch (e) {} tuDong(); };
  $('nutKetNoi').onclick = function () {
    var u = chuan($('oDiaChi').value);
    if (!u) return;
    dangKetNoi();
    thu(u, 8000).then(function (s) {
      if (s) moWeb(u);
      else { $('trangThai').innerHTML = '<span>Không kết nối được địa chỉ này.</span>'; $('khungNhap').classList.remove('an'); }
    });
  };
  $('oDiaChi').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('nutKetNoi').click(); });

  if (/[?&]doi_may_chu=1/.test(location.search)) {
    $('trangThai').classList.add('an');
    $('khungNhap').classList.remove('an');
    $('oDiaChi').value = daLuu() || CONG_KHAI[0] || '';
  } else {
    tuDong();
  }
})();
</script>
</body>
</html>
